<pattern id="scan" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9DABAF" stroke-opacity=".045" stroke-width=".7"/></pattern>
</defs><rect width="1320" height="398" rx="14" fill="url(#back)"/><rect width="1320" height="398" rx="14" fill="url(#scan)"/><path d="M20 20H1300M20 378H1300" stroke="#8F9DA2" stroke-opacity=".13"/><text x="56" y="54" font-family="DejaVu Sans Mono,monospace" font-size="12" letter-spacing="1.1" fill="#9FC3D3">SO  /  SYSTEM OVERVIEW</text><text x="56" y="109" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="0.25" fill="#E8E9E4">MOVE THE DOMAIN. KEEP THE DATA.</text><text x="57" y="145" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="450" letter-spacing="0" fill="#98A4A7">Migration is manual; never edit Home Assistant registries by hand.</text><path d="M58 174H1262" stroke="#9FC3D3" stroke-opacity=".30" stroke-width="1"/><rect x="54" y="191" width="289.5" height="158" rx="9" fill="url(#card)" stroke="#4E5B61" stroke-opacity=".6"/><rect x="76" y="214" width="36" height="30" rx="3" fill="#2D2922" stroke="#8A7352" stroke-opacity=".6"/><text x="82" y="235" font-family="DejaVu Sans Mono,monospace" font-size="15" letter-spacing="1.1" fill="#9FC3D3">01</text><text x="77" y="280" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#E8E9E4">BACK UP</text><text x="77" y="312" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="450" letter-spacing="0" fill="#98A4A7">Full HA backup</text><text x="77" y="332" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="450" letter-spacing="0" fill="#98A4A7">Record entity IDs</text><path d="M346.5 269l11 0m-5 -5l5 5l-5 5" stroke="#9FC3D3" stroke-width="1.4" stroke-opacity=".75" fill="none"/><rect x="361.5" y="191" width="289.5" height="158" rx="9" fill="url(#card)" stroke="#4E5B61" stroke-opacity=".6"/><rect x="383.5" y="214" width="36" height="30" rx="3" fill="#2D2922" stroke="#8A7352" stroke-opacity=".6"/><text x="389.5" y="235" font-family="DejaVu Sans Mono,monospace" font-size="15" letter-spacing="1.1" fill="#9FC3D3">02</text><text x="384.5" y="280" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#E8E9E4">REMOVE OLD</text><text x="384.5" y="312" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="450" letter-spacing="0" fill="#98A4A7">HA UI: old so_s5</text><text x="384.5" y="332" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="450" letter-spacing="0" fill="#98A4A7">Keep token files</text><path d="M654 269l11 0m-5 -5l5 5l-5 5" stroke="#9FC3D3" stroke-width="1.4" stroke-opacity=".75" fill="none"/><rect x="669" y="191" width="289.5" height="158" rx="9" fill="url(#card)" stroke="#4E5B61" stroke-opacity=".6"/><rect x="691" y="214" width="36" height="30" rx="3" fill="#2D2922" stroke="#8A7352" stroke-opacity=".6"/><text x="697" y="235" font-family="DejaVu Sans Mono,monospace" font-size="15" letter-spacing="1.1" fill="#9FC3D3">03</text><text x="692" y="280" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#E8E9E4">INSTALL NEW</text><text x="692" y="312" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="450" letter-spacing="0" fill="#98A4A7">so_diffuser_ble</text><text x="692" y="332" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="450" letter-spacing="0" fill="#98A4A7">Restart and re-add</text><path d="M961.5 269l11 0m-5 -5l5 5l-5 5" stroke="#9FC3D3" stroke-width="1.4" stroke-opacity=".75" fill="none"/><rect x="976.5" y="191" width="289.5" height="158" rx="9" fill="url(#card)" stroke="#4E5B61" stroke-opacity=".6"/><rect x="998.5" y="214" width="36" height="30" rx="3" fill="#2D2922" stroke="#8A7352" stroke-opacity=".6"/><text x="1004.5" y="235" font-family="DejaVu Sans Mono,monospace" font-size="15" letter-spacing="1.1" fill="#9FC3D3">04</text><text x="999.5" y="280" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="650" letter-spacing="0" fill="#E8E9E4">VERIFY</text><text x="999.5" y="312" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="450" letter-spacing="0" fill="#98A4A7">BLE controls + entities</text><text x="999.5" y="332" font-family="Inter,DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="450" letter-spacing="0" fill="#98A4A7">Check automations</text></svg>