<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="398" viewBox="0 0 1320 398" role="img" aria-label="Backup, safely retire prior integration, add new domain and verify automations"><title>SO Diffuser BLE — migration steps</title><defs>
<linearGradient id="back" x1="0" y1="0" x2=".94" y2="1"><stop stop-color="#06090C"/><stop offset=".58" stop-color="#10151A"/><stop offset="1" stop-color="#1B1D1B"/></linearGradient>
<linearGradient id="ceramic" x1="0" y1=".2" x2="1" y2=".65"><stop stop-color="#82939E"/><stop offset=".10" stop-color="#D9DFE0"/><stop offset=".34" stop-color="#F0F1EE"/><stop offset=".70" stop-color="#B6C0C6"/><stop offset="1" stop-color="#6B7883"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4B4135"/><stop offset=".32" stop-color="#AE8151"/><stop offset=".5" stop-color="#FFE2A6"/><stop offset=".7" stop-color="#BD8B50"/><stop offset="1" stop-color="#514337"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151B20"/><stop offset="1" stop-color="#0A1015"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#9E6B38" stop-opacity=".27"/><stop offset=".60" stop-color="#89572C" stop-opacity=".09"/><stop offset="1" stop-color="#985927" stop-opacity="0"/></radialGradient>
<radialGradient id="cool"><stop stop-color="#7199A4" stop-opacity=".18"/><stop offset="1" stop-color="#7199A4" stop-opacity="0"/></radialGradient>
<linearGradient id="mist"><stop stop-color="#E1E8E5" stop-opacity="0"/><stop offset=".45" stop-color="#CCD8DB" stop-opacity=".55"/><stop offset="1" stop-color="#DCE5E4" stop-opacity=".02"/></linearGradient>
