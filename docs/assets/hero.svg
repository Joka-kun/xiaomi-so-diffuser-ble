<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-label="Cinematic S5 product artwork with angled diffuser, light ribbons and English typography">
<title>SO Diffuser BLE — Noir in Motion</title>
<desc>Original conceptual illustration based on the SO S5 device reference, not a photograph. The product has an off-white rounded-square body, black circular front display and lower-right button; light trails are decorative.</desc>
