<filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="13" flood-color="#000" flood-opacity=".8"/></filter>
<pattern id="grit" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#95AEBC" stroke-opacity=".026"/></pattern>
</defs>
