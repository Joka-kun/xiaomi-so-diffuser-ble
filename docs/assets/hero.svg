<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5E412D"/><stop offset=".28" stop-color="#FFE2A6"/><stop offset=".72" stop-color="#AE714A"/><stop offset="1" stop-color="#50301F"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#28353F"/><stop offset=".36" stop-color="#0B131C"/><stop offset="1" stop-color="#010306"/></linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#18A8D0" stop-opacity="0"/><stop offset=".35" stop-color="#3CE5EE"/><stop offset=".67" stop-color="#B693F0"/><stop offset="1" stop-color="#FFE2A6"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#27C6D3" stop-opacity=".30"/><stop offset="1" stop-color="#0F2D36" stop-opacity="0"/></radialGradient>
