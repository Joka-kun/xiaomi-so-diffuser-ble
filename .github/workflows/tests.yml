name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Build PNG branding and compare with committed artwork
        run: |
          python -m pip install cairosvg pillow
          mkdir -p "$RUNNER_TEMP/brand-original"
          cp custom_components/so_diffuser_ble/brand/*.png "$RUNNER_TEMP/brand-original/"
          python tools/build_brand_assets.py
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          base = Path("custom_components/so_diffuser_ble/brand")
          previous = Path(os.environ["RUNNER_TEMP"]) / "brand-original"
          for name in ("icon.png", "icon@2x.png", "logo.png", "logo@2x.png"):
              with Image.open(base / name) as rebuilt, Image.open(previous / name) as committed:
                  assert rebuilt.size == committed.size, name
                  assert rebuilt.mode == committed.mode == "RGBA", name
                  assert rebuilt.tobytes() == committed.tobytes(), (
                      f"{name} does not match the canonical editable SVG. "
                      "Run python tools/build_brand_assets.py and commit the PNG."
                  )
          print("All four committed PNGs match their SVG sources pixel-for-pixel")
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q custom_components tools tests
