name: Brand artwork preview (temporary)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Render SVG source into all four installable PNGs
        run: |
          python -m pip install cairosvg pillow
          python tools/build_brand_assets.py
      - name: Export public PNG bytes for owner-authored artwork commit
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image
          base = Path('custom_components/so_diffuser_ble/brand')
          for name in ('icon.png', 'icon@2x.png', 'logo.png', 'logo@2x.png'):
              path = base / name
              with Image.open(path) as im:
                  assert im.mode == 'RGBA', (name, im.mode)
              encoded = base64.b64encode(path.read_bytes()).decode('ascii')
              for index in range(0, len(encoded), 3000):
                  print(f'BRAND_ASSET:{name}:{index // 3000}:{encoded[index:index + 3000]}')
          PY
